<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>R6 Loadout</title>
  <meta name="description" content="Najlepszy loadout dla każdego operatora Rainbow Six Siege: broń, dodatki, gadżety. Szybko i czytelnie.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <a class="logo" href="#/">R6 <span>LOADOUT</span></a>
      <nav class="tabs">
        <a href="#/" data-tab="ops">Operatorzy</a>
        <a href="#/lista" data-tab="list">Lista</a>
      </nav>
      <input type="search" id="search" placeholder="Szukaj operatora…" autocomplete="off">
      <div class="sidebar-list" id="sidebar-list"></div>
      <div class="sidebar-foot">
        <p class="foot-note">Loadouty: meta wg skycoach.gg (10.2026) + własne poprawki.<br>Ikony: r6operators (MIT). Flagi: flagcdn.</p>
      </div>
    </aside>

    <main class="main" id="main"></main>
  </div>

  <!-- biblioteki z CDN (opcjonalne: bez nich strona działa, tylko bez animacji) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vanta/0.5.24/vanta.net.min.js"></script>

  <script src="data/weapons.js"></script>
  <script src="data/opmeta.js"></script>
  <script src="data/operators.js"></script>
  <script src="js/anim.js"></script>
  <script src="js/weapons.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
