<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#2f3540" stroke-width="1"/>
    </pattern>
    <style>
      .room { fill: #262b34; }
      .wall { fill: none; stroke: #9aa3b2; stroke-width: 12; stroke-linejoin: miter; }
      .inner { fill: none; stroke: #9aa3b2; stroke-width: 8; }
      .door { stroke: #1a1d23; stroke-width: 14; }
      .label { font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-size: 44px; font-weight: 700; fill: #c7cdd8; letter-spacing: 2px; text-transform: uppercase; }
      .small { font-family: "Barlow", Arial, sans-serif; font-size: 22px; fill: #6f7888; }
      .furn { fill: #343a46; stroke: #4a5160; stroke-width: 3; }
      .stair { stroke: #6f7888; stroke-width: 4; }
      .wm { font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-size: 120px; font-weight: 700; fill: #ffffff; opacity: 0.05; letter-spacing: 10px; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#1a1d23"/>
  <rect x="100" y="100" width="1400" height="800" fill="url(#grid)"/>
  <rect x="100" y="100" width="1400" height="800" class="room" opacity="0.7"/>

  <!-- pomieszczenia -->
  <rect x="100" y="100" width="400" height="350" class="room"/>
  <rect x="500" y="100" width="400" height="350" class="room"/>
  <rect x="900" y="100" width="600" height="350" class="room"/>
  <rect x="100" y="450" width="1400" height="110" fill="#2b3039"/>
  <rect x="100" y="560" width="500" height="340" class="room"/>
  <rect x="600" y="560" width="500" height="340" class="room"/>
  <rect x="1100" y="560" width="400" height="340" class="room"/>

  <!-- meble -->
  <rect x="150" y="150" width="180" height="90" class="furn"/>
  <rect x="380" y="320" width="90" height="100" class="furn"/>
  <rect x="540" y="140" width="60" height="280" class="furn"/>
  <rect x="640" y="140" width="60" height="280" class="furn"/>
  <rect x="740" y="140" width="60" height="180" class="furn"/>
  <rect x="1050" y="180" width="300" height="60" class="furn"/>
  <rect x="140" y="600" width="420" height="70" class="furn"/>
  <rect x="140" y="780" width="200" height="80" class="furn"/>
  <rect x="700" y="660" width="300" height="130" class="furn"/>
  <line x1="1150" y1="600" x2="1450" y2="600" class="stair"/>
  <line x1="1150" y1="640" x2="1450" y2="640" class="stair"/>
  <line x1="1150" y1="680" x2="1450" y2="680" class="stair"/>
  <line x1="1150" y1="720" x2="1450" y2="720" class="stair"/>
  <line x1="1150" y1="760" x2="1450" y2="760" class="stair"/>
  <line x1="1150" y1="800" x2="1450" y2="800" class="stair"/>

  <!-- ściany -->
  <rect x="100" y="100" width="1400" height="800" class="wall"/>
  <line x1="500" y1="100" x2="500" y2="450" class="inner"/>
  <line x1="900" y1="100" x2="900" y2="450" class="inner"/>
  <line x1="100" y1="450" x2="1500" y2="450" class="inner"/>
  <line x1="100" y1="560" x2="1500" y2="560" class="inner"/>
  <line x1="600" y1="560" x2="600" y2="900" class="inner"/>
  <line x1="1100" y1="560" x2="1100" y2="900" class="inner"/>

  <!-- drzwi (przerwy w ścianach) -->
  <line x1="500" y1="230" x2="500" y2="310" class="door"/>
  <line x1="900" y1="230" x2="900" y2="310" class="door"/>
  <line x1="260" y1="450" x2="340" y2="450" class="door"/>
  <line x1="660" y1="450" x2="740" y2="450" class="door"/>
  <line x1="1160" y1="450" x2="1240" y2="450" class="door"/>
  <line x1="240" y1="560" x2="320" y2="560" class="door"/>
  <line x1="780" y1="560" x2="860" y2="560" class="door"/>
  <line x1="1260" y1="560" x2="1340" y2="560" class="door"/>
  <line x1="1500" y1="480" x2="1500" y2="540" class="door"/>
  <line x1="100" y1="480" x2="100" y2="540" class="door"/>

  <!-- podpisy -->
  <text x="300" y="300" text-anchor="middle" class="label">Biuro</text>
  <text x="700" y="300" text-anchor="middle" class="label">Magazyn</text>
  <text x="1200" y="320" text-anchor="middle" class="label">Hol</text>
  <text x="800" y="517" text-anchor="middle" class="label">Korytarz</text>
  <text x="350" y="740" text-anchor="middle" class="label">Kuchnia</text>
  <text x="850" y="860" text-anchor="middle" class="label">Jadalnia</text>
  <text x="1300" y="870" text-anchor="middle" class="label">Schody</text>
  <text x="1480" y="500" text-anchor="end" class="small">wejście</text>
  <text x="120" y="500" class="small">wejście</text>

  <text x="800" y="60" text-anchor="middle" class="small">Przykładowy schemat piętra. Podmień na własny screen z gry: maps/&lt;mapa&gt;/&lt;piętro&gt;.jpg</text>
  <text x="800" y="990" text-anchor="middle" class="wm">PRZYKŁAD</text>
</svg>
